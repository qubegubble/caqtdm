version: '3.8'

services:
  server1:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4841:4840"
    environment:
      - PORT=4840
      - PUBLIC_PORT=4841
      - PUBLIC_HOST=localhost
    networks:
      - app-network

  server2:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4842:4840"
    environment:
      - PORT=4840
      - PUBLIC_PORT=4842
      - PUBLIC_HOST=localhost
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
