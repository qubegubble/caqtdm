version: '3.8'

services:
  server1:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4841:4840"
    environment:
      - PORT=4840           # container's internal port
      - PUBLIC_PORT=4841    # host-exposed port
      - PUBLIC_HOST=localhost  # for local testing from host
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
